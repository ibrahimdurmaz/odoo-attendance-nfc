# Geliştirme için Odoo 19 + PostgreSQL. Kurulum: README.md → "Odoo'yu çalıştırma".
# POSTGRES_PASSWORD .env dosyasından okunur (.env.example'ı kopyala).
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - odoo_db_data:/var/lib/postgresql/data

  odoo:
    image: odoo:19.0 # "latest" artık Odoo 20, mutlaka 19.0 yaz
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - '8088:8069'
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./addons:/mnt/extra-addons # nfc_card_writer + nfc_gate_access
      - odoo_web_data:/var/lib/odoo

volumes:
  odoo_db_data:
  odoo_web_data:
